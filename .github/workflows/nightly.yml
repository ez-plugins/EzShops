name: Nightly Beta Release

# Fires at 04:00 UTC every day. Can also be triggered manually.
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  nightly-beta:
    name: Nightly Beta Release
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for pushing the version bump and creating tags

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history needed for tag-based change detection
          token: ${{ secrets.GITHUB_TOKEN }}

      # Only proceed when there are real (non-bot) commits since the last tag
      # (stable or nightly). This prevents duplicate nightlies on days with no new work.
      - name: Check for unreleased changes since last tag
        id: changes
        run: |
          # Use git describe to find the nearest ancestor tag by commit-graph
          # distance. This is more reliable than --sort=-creatordate, which uses
          # the tagged commit's date for lightweight tags and can mis-order a
          # stable release tag applied after its commit relative to a nightly tag
          # that points to a newer commit, causing a duplicate nightly build.
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD 2>/dev/null || echo "")
          echo "last_tag=${LAST_TAG}" >> "$GITHUB_OUTPUT"
          if [ -z "$LAST_TAG" ]; then
            echo "No release tags found; first nightly will proceed."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "Last release tag: $LAST_TAG"
            TOTAL=$(git log "${LAST_TAG}..HEAD" --oneline | wc -l)
            BOT=$(git log "${LAST_TAG}..HEAD" --oneline --author='github-actions\[bot\]' | wc -l)
            COUNT=$((TOTAL - BOT))
            if [ "$COUNT" -gt 0 ]; then
              echo "$COUNT non-bot commit(s) since $LAST_TAG; proceeding with nightly."
              echo "has_changes=true" >> "$GITHUB_OUTPUT"
            else
              echo "No new commits since $LAST_TAG; skipping nightly release."
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Set up JDK 21
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Compute the nightly version used for the JAR, Modrinth release, and git tag.
      # e.g. 2.5.1-nightly.20260512
      - name: Compute nightly version
        if: steps.changes.outputs.has_changes == 'true'
        id: version
        run: |
          CURRENT=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          # Strip any existing pre-release suffix so re-runs start from a clean base
          BASE=$(echo "$CURRENT" | sed 's/-.*//')
          DATE=$(date -u '+%Y%m%d')
          NIGHTLY="${BASE}-nightly.${DATE}"
          echo "nightly=${NIGHTLY}" >> "$GITHUB_OUTPUT"
          echo "Nightly version : $NIGHTLY"

      - name: Set nightly version in POM
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          mvn -B -ntp versions:set \
            -DnewVersion="${{ steps.version.outputs.nightly }}" \
            -DgenerateBackupPoms=false

      - name: Build
        if: steps.changes.outputs.has_changes == 'true'
        run: mvn -B -ntp -DskipTests package

      - name: Build changelog
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          DATE_DISPLAY=$(date -u '+%B %d, %Y')
          SHORT_SHA="${GITHUB_SHA:0:7}"
          REPO="${{ github.repository }}"

          # Extract the [Unreleased] section from CHANGELOG.md as the primary changelog.
          UNRELEASED=$(awk \
            '/^## \[Unreleased\]/ { p=1; next }
             /^## \[/ && p { exit }
             p { print }' \
            CHANGELOG.md | sed '/^[[:space:]]*$/d')

          {
            if [ -n "$UNRELEASED" ]; then
              printf '%s\n\n' "$UNRELEASED"
            fi
            printf '#### Notes\n\n'
            printf '> 🌙 Automated nightly beta build from `main` (%s).\n' "$DATE_DISPLAY"
            printf '>\n'
            printf '> Built from [`%s`](https://github.com/%s/commit/%s)\n' \
              "$SHORT_SHA" "$REPO" "${{ github.sha }}"
          } > changelog.md

          echo "=== Changelog preview ===" && cat changelog.md

      - name: Release to Modrinth (beta)
        if: steps.changes.outputs.has_changes == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: zaW55ehx
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: true
          name: "EzShops ${{ steps.version.outputs.nightly }}"
          version: "${{ steps.version.outputs.nightly }}"
          version-type: beta
          files: "target/EzShops-${{ steps.version.outputs.nightly }}.jar"
          game-versions: ">=1.13"
          game-versions-filter: release
          loaders: |
            bukkit
            spigot
            paper
            purpur
            folia
          changelog-file: changelog.md
          dependencies: |
            vault | required
            teams-api | optional
            ezboost | optional

      - name: Create and push nightly tag
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.nightly }}"
          git push origin "${{ steps.version.outputs.nightly }}"

      - name: Create GitHub Release
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.nightly }}" \
            --title "EzShops ${{ steps.version.outputs.nightly }}" \
            --notes-file changelog.md \
            --prerelease \
            "target/EzShops-${{ steps.version.outputs.nightly }}.jar"

      - name: Post Discord notification
        if: steps.changes.outputs.has_changes == 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.EZSHOPS_RELEASE_DISCORD_WEBHOOK }}
        run: |
          REPO="${{ github.repository }}"
          VERSION="${{ steps.version.outputs.nightly }}"
          GH_URL="https://github.com/${REPO}/releases/tag/${VERSION}"
          MODRINTH_URL="https://modrinth.com/plugin/ezshops/version/${VERSION}"

          # Truncate changelog body to fit Discord's 4096-char embed description limit.
          # Strip the "=== Changelog preview ===" debug line if present.
          CHANGELOG=$(grep -v '^===' changelog.md | head -c 3800 || true)

          PAYLOAD=$(jq -n \
            --arg version "$VERSION" \
            --arg gh_url "$GH_URL" \
            --arg modrinth_url "$MODRINTH_URL" \
            --arg changelog "$CHANGELOG" \
            '{
              embeds: [{
                title: ("🌙 EzShops " + $version + " — Nightly Beta"),
                url: $gh_url,
                color: 3066993,
                description: $changelog,
                fields: [
                  { name: "GitHub Release", value: ("[View on Github](" + $gh_url + ")"),         inline: true },
                  { name: "Modrinth",       value: ("[Download on Modrinth](" + $modrinth_url + ")"), inline: true }
                ],
                footer: { text: "Automated nightly build" }
              }]
            }')

          curl --fail -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
